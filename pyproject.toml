[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tsp-mlx"
version = "0.1.0"
description = "The τ-Spectral Pruner (TSP): A Neuro-Symbolic Paging Router for MLX LLMs."
authors = [{ name = "steph4n-gh" }]
license = { text = "MIT" }
dependencies = [
    "mlx>=0.31.0",
    "mlx-lm>=0.31.0",
    "numpy>=1.26.0"
]

[project.urls]
Homepage = "https://github.com/steph4n-gh/tsp-mlx"
